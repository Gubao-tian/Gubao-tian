<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Gubao-tian — STUDENT · DEVELOPER. Building with Python and large language models.">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141c2f"/>
    </linearGradient>
    <linearGradient id="haccent" x1="80" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="hrule" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#a78bfa" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hgrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <filter id="hglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="hframe"><rect width="1200" height="300" rx="16"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .cursor { animation: blink 1.15s steps(1, end) infinite; }
      .orb-a { animation: drift 14s ease-in-out infinite; }
      .orb-b { animation: drift 18s ease-in-out infinite reverse; }
      .fade-in { animation: rise .9s ease-out both; }
      .d1 { animation-delay: .12s; }
      .d2 { animation-delay: .24s; }
      .d3 { animation-delay: .38s; }
      @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
      @keyframes drift { 0%, 100% { transform: translate3d(0,0,0) } 50% { transform: translate3d(0,-14px,0) } }
      @keyframes rise { from { opacity: 0; transform: translate3d(0,10px,0) } to { opacity: 1; transform: translate3d(0,0,0) } }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .orb-a, .orb-b, .fade-in { animation: none }
      }
    </style>
  </defs>

  <g clip-path="url(#hframe)">
    <rect width="1200" height="300" fill="url(#hbg)"/>
    <rect width="1200" height="300" fill="url(#hgrid)" opacity="0.35"/>
    <circle class="orb-a" cx="1035" cy="36" r="170" fill="#7c3aed" opacity="0.2" filter="url(#hglow)"/>
    <circle class="orb-b" cx="95" cy="292" r="130" fill="#0891b2" opacity="0.16" filter="url(#hglow)"/>

    <rect x="0" y="0" width="1200" height="3" fill="url(#hrule)"/>

    <g class="fade-in d1">
      <text x="80" y="86" class="mono" font-size="12.5" letter-spacing="4.2" fill="#8b9ab3">STUDENT · DEVELOPER</text>
    </g>

    <g class="fade-in d2">
      <text x="78" y="158" class="sans" font-size="58" font-weight="800" letter-spacing="-1.2" fill="url(#haccent)">Gubao-tian</text>
    </g>

    <g class="fade-in d3">
      <text x="80" y="200" class="sans" font-size="19" fill="#8b9ab3">Building with Python and large language models.</text>
    </g>

    <g class="fade-in d3">
      <rect x="80" y="228" width="26" height="2" fill="#22d3ee"/>
      <text x="80" y="262" class="mono" font-size="12.5" letter-spacing="1.6" fill="#5b6b85">github.com/Gubao-tian</text>
    </g>

    <g transform="translate(760 62)">
      <rect width="360" height="182" rx="12" fill="#0d1526" stroke="#243149" stroke-width="1"/>
      <rect x="1" y="1" width="358" height="28" rx="11" fill="none" stroke="#243149" stroke-width="1" opacity=".7"/>
      <circle cx="20" cy="15" r="4" fill="#f87171" opacity=".85"/>
      <circle cx="36" cy="15" r="4" fill="#fbbf24" opacity=".85"/>
      <circle cx="52" cy="15" r="4" fill="#34d399" opacity=".85"/>
      <text x="76" y="19" class="mono" font-size="11" fill="#5b6b85">~/gubao-tian</text>
      <g transform="translate(22 46)">
      <text x="0" y="22" class="mono" font-size="13" fill="#5b6b85">$ whoami</text>
      <text x="0" y="38" class="mono" font-size="15" fill="#e2e8f0">student / developer</text>
      <text x="0" y="64" class="mono" font-size="13" fill="#5b6b85">$ stack</text>
      <text x="0" y="80" class="mono" font-size="15" fill="#e2e8f0">python · llm apps</text>
      <text x="0" y="106" class="mono" font-size="13" fill="#5b6b85">$ status</text>
      <text x="0" y="122" class="mono" font-size="15" fill="#e2e8f0">learning in public</text>
        <rect class="cursor" x="176" y="110" width="8" height="15" fill="#22d3ee"/>
      </g>
    </g>
  </g>
</svg>
